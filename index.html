<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MeMo</title>
<meta name="description" content="Fai una foto, detta una scadenza e dimenticatela: ti avvisa MeMo quando è il momento.">
<meta name="theme-color" content="#F3F6FA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MeMo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
@property --mood1 { syntax: '<color>'; inherits: true; initial-value: #4ADBA2; }
@property --mood2 { syntax: '<color>'; inherits: true; initial-value: #C9A7FF; }

/* ================= COLORI: Giorno, tarato sull'icona ================= */
:root{
  --bg:#F3F6FA; --ink:#121826; --ink-2:rgba(18,24,38,.62); --ink-3:rgba(18,24,38,.42);
  --violet:#7B61FF; --azure:#4C8DF6; --teal:#2FCDBE;
  --brand:#4C8DF6; --brand-ink:#2F6FE0; --brand-grad:linear-gradient(135deg,#7B61FF 0%,#4C8DF6 52%,#2FCDBE 100%);
  --card:#FFFFFF; --card-press:#F6F8FC; --stroke:rgba(18,24,38,.06); --card-shadow:0 1px 2px rgba(18,24,38,.04), 0 10px 30px rgba(43,72,140,.06);
  --orb:#F1F4FA; --sheet:rgba(255,255,255,.97); --field:#F1F4F9;
  --dock:rgba(255,255,255,.8); --dock-stroke:rgba(18,24,38,.06); --dock-ink:#121826; --side:#EEF2F8;
  --cam:var(--brand-grad); --cam-ink:#fff; --cam-glow:0 0 0 6px rgba(76,141,246,.14), 0 12px 30px rgba(91,97,255,.38);
  --btn-bg:var(--brand-grad); --btn-ink:#fff; --toast-bg:#121826; --toast-ink:#fff;
  --calm:#2FCDBE; --calm-2:#7B61FF; --soon:#4C8DF6; --soon-2:#7B61FF; --now:#FF5C6C; --now-2:#FFA35A; --empty:#7B61FF; --empty-2:#2FCDBE;
  --now-ink:#E23548; --soon-ink:#2F6FE0; --thread:#4C8DF6;
  --aurora:.38; --ring-track:rgba(18,24,38,.06); --ring-w:7; --num-w:850; --num-fill:linear-gradient(165deg,#121826 32%,var(--mood2) 70%,var(--mood1)); --glow:none;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --scheme:light;
}
body{--mood1:var(--calm);--mood2:var(--calm-2);transition:--mood1 1.4s ease, --mood2 1.4s ease}
body[data-mood="now"]{--mood1:var(--now);--mood2:var(--now-2)}
body[data-mood="soon"]{--mood1:var(--soon);--mood2:var(--soon-2)}
body[data-mood="empty"]{--mood1:var(--empty);--mood2:var(--empty-2)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color-scheme:var(--scheme);scroll-snap-type:y proximity}
html,body{margin:0;color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;text-size-adjust:100%}
body{min-height:100svh;background:var(--bg);overscroll-behavior-y:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--mood1);outline-offset:2px;border-radius:14px}
[hidden]{display:none!important}

/* ---------- luce di sfondo ---------- */
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:calc(var(--aurora) * (1 - var(--p, 0) * .55))}
.aurora i{position:absolute;width:95vmax;height:95vmax;border-radius:50%}
.aurora i:nth-child(1){background:radial-gradient(circle, var(--mood1) 0%, transparent 58%);top:-48vmax;left:-38vmax;animation:drift1 19s ease-in-out infinite alternate}
.aurora i:nth-child(2){background:radial-gradient(circle, var(--mood2) 0%, transparent 58%);top:-18vmax;right:-55vmax;animation:drift2 23s ease-in-out infinite alternate;opacity:.75}
@keyframes drift1{to{transform:translate(18vmax,14vmax) scale(1.12)}}
@keyframes drift2{to{transform:translate(-14vmax,18vmax) scale(.92)}}

/* ---------- barra in alto ---------- */
.bar{position:fixed;top:0;left:0;right:0;z-index:10;height:calc(env(safe-area-inset-top) + 54px);padding:env(safe-area-inset-top) 10px 0 18px;display:flex;align-items:center;justify-content:space-between}
.bar::before{content:"";position:absolute;inset:0;background:color-mix(in srgb, var(--bg) 72%, transparent);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);opacity:var(--p2, 0)}
.brand{position:relative;display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;letter-spacing:-.01em;opacity:calc(1 - var(--p2, 0))}
.brand svg{width:28px;height:28px}
.mini{position:absolute;left:20px;top:calc(env(safe-area-inset-top) + 27px);transform:translateY(-50%) translateY(calc((1 - var(--p2, 0)) * 8px));opacity:var(--p2, 0);display:flex;align-items:center;gap:8px;font-weight:750;font-size:15px;white-space:nowrap;pointer-events:none}
.mini .dot{width:9px;height:9px;border-radius:50%;background:var(--mood1);box-shadow:0 0 0 2px color-mix(in srgb, var(--ink) 10%, transparent)}
.icon-btn{position:relative;width:44px;height:44px;border-radius:22px;display:grid;place-items:center;color:var(--ink-2)}
.icon-btn:active{background:var(--card-press)}

/* ---------- schermata principale a pieno schermo ---------- */
.hero{position:sticky;top:0;height:100svh;z-index:1;display:grid;place-items:center;padding:calc(env(safe-area-inset-top) + 40px) 28px calc(150px + env(safe-area-inset-bottom));scroll-snap-align:start}
.hero-inner{text-align:center;transform-origin:50% 40%;will-change:transform,opacity;max-width:430px}
.ring{position:relative;width:min(64vw,260px,36svh);aspect-ratio:1;margin:0 auto 26px}
.ring svg.r{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ring .track{fill:none;stroke:var(--ring-track);stroke-width:var(--ring-w)}
.ring .arc{fill:none;stroke:url(#ringGrad);stroke-width:var(--ring-w);stroke-linecap:round;transition:stroke-dashoffset 1.6s cubic-bezier(.2,.8,.2,1);filter:var(--glow)}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num{font-size:clamp(70px,24vw,112px);line-height:.9;font-weight:var(--num-w);letter-spacing:-.06em;background:var(--num-fill);-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.ring .unit{font-size:14.5px;font-weight:700;color:var(--ink-2);margin-top:10px}
.ring .knot{width:46%;color:var(--mood1)}
.hero h1{font-size:clamp(27px,7.6vw,34px);line-height:1.08;font-weight:800;letter-spacing:-.025em;margin:0 0 10px;text-wrap:balance}
.hero p{font-size:16.5px;line-height:1.45;color:var(--ink-2);margin:0 auto;max-width:30ch;text-wrap:pretty}
.peek{position:fixed;left:0;right:0;bottom:calc(122px + env(safe-area-inset-bottom));z-index:3;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;font-weight:700;color:var(--ink-3);opacity:calc(1 - var(--p, 0) * 3)}
.peek svg{animation:cue 2.4s ease-in-out infinite}
@keyframes cue{50%{transform:translateY(4px)}}

/* ---------- la linea delle scadenze ---------- */
.list-sec{position:relative;z-index:2;min-height:100svh;padding:calc(env(safe-area-inset-top) + 62px) 16px calc(150px + env(safe-area-inset-bottom));scroll-snap-align:start}
.list-sec::before{content:"";position:absolute;left:0;right:0;top:-45svh;height:45svh;background:linear-gradient(to bottom, transparent, var(--bg));pointer-events:none}
.list-sec::after{content:"";position:absolute;inset:0;background:var(--bg);z-index:-1}
.wrap{max-width:620px;margin:0 auto}
.list-title{font-size:27px;font-weight:800;letter-spacing:-.025em;margin:4px 4px 18px;white-space:nowrap}
.thread{position:relative}
.thread::before{content:"";position:absolute;left:37px;top:var(--t-top,0);bottom:var(--t-bot,0);width:2.5px;background:linear-gradient(to bottom,var(--violet),var(--azure),var(--teal));border-radius:2px;opacity:.9}
.thread:empty::before{display:none}
.group{margin:0 0 12px}
.group h2{font-size:14.5px;font-weight:750;color:var(--ink-3);margin:12px 0 8px 76px}
.rows{display:flex;flex-direction:column;gap:8px}
.row-wrap{position:relative;border-radius:22px;overflow:hidden;opacity:0;transform:translateY(18px);transition:opacity .6s ease, transform .6s cubic-bezier(.2,.8,.2,1)}
.row-wrap.in{opacity:1;transform:none}
.swipe-bg{position:absolute;inset:0;border-radius:22px;background:linear-gradient(90deg,transparent 25%,#3CCB8F);display:flex;align-items:center;justify-content:flex-end;padding-right:22px;font-weight:800;color:#06281A;opacity:0}
.row{position:relative;display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 14px;border-radius:22px;background:var(--card);border:1px solid var(--stroke);box-shadow:var(--card-shadow);transition:transform .25s cubic-bezier(.2,.8,.2,1),background .2s;touch-action:pan-y}
.row:active{background:var(--card-press)}
.row.dragging{transition:none}
.orb{flex:0 0 48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--orb);border:1.5px solid color-mix(in srgb, var(--ink) 12%, transparent);position:relative;z-index:1}
.row[data-s="now"] .orb{border-color:var(--now-ink);box-shadow:0 0 0 4px color-mix(in srgb, var(--now) 22%, transparent)}
.row[data-s="soon"] .orb{border-color:rgba(76,141,246,.55)}
.row .txt{flex:1;min-width:0}
.row .t{display:block;font-size:17px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{display:block;font-size:14px;color:var(--ink-2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{flex:0 0 auto;text-align:right;line-height:1;min-width:44px}
.count b{display:block;font-size:24px;font-weight:850;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.count span{display:block;font-size:11.5px;font-weight:700;color:var(--ink-3);margin-top:3px}
.row[data-s="now"] .count b,.row[data-s="now"] .s{color:var(--now-ink)}
.row[data-s="soon"] .count b{color:var(--soon-ink)}
.tip{font-size:13px;color:var(--ink-3);text-align:center;margin:16px 0 0}
.starter h2{font-size:14.5px;font-weight:750;color:var(--ink-3);margin:22px 4px 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:10px 14px 10px 12px;border-radius:999px;background:var(--card);border:1px solid var(--stroke);box-shadow:var(--card-shadow);font-size:15px;font-weight:650;white-space:nowrap;transition:transform .15s,background .2s}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.chips.scroll{position:relative;flex-wrap:nowrap;overflow-x:auto;margin:0 -20px;padding:2px 20px 8px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.install{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--stroke);border-radius:20px;padding:14px 10px 14px 16px;margin:22px 0 0;font-size:15px;line-height:1.4;color:var(--ink-2)}
.install p{margin:0;flex:1}.install b{color:var(--ink);font-weight:700}

/* ---------- intestazione lista e calendario ---------- */
.list-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 4px 18px}
.list-head .list-title{margin:0}
.seg{display:flex;background:#E6EBF3;border-radius:14px;padding:3px;flex:0 0 auto}
.seg button{padding:8px 12px;border-radius:11px;font-size:14px;font-weight:750;color:var(--ink-2);transition:background .2s,color .2s}
.seg button[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(18,24,38,.1)}
.cal{background:var(--card);border-radius:24px;box-shadow:var(--card-shadow);padding:14px 10px 10px;border:1px solid var(--stroke);touch-action:pan-y}
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px 8px}
.cal-head h3{margin:0;font-size:20px;font-weight:800;letter-spacing:-.015em}
.cal-nav{display:flex;align-items:center;gap:2px}
.cal-nav button{min-width:38px;height:38px;border-radius:19px;display:grid;place-items:center;color:var(--ink-2)}
.cal-nav button:active{background:var(--field)}
.cal-nav .cal-today{font-size:14px;font-weight:750;color:var(--brand-ink);padding:0 10px}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.dow span{text-align:center;font-size:12px;font-weight:750;color:var(--ink-3);padding:2px 0 6px}
.day{position:relative;height:50px;display:flex;flex-direction:column;align-items:center;padding-top:4px;border-radius:14px;font-size:16px;font-weight:650;font-variant-numeric:tabular-nums;color:var(--ink)}
.day:active{background:var(--field)}
.day.out{visibility:hidden}
.day.past{color:var(--ink-3)}
.day .n{width:32px;height:32px;display:grid;place-items:center;border-radius:16px}
.day.today .n{color:var(--brand-ink);font-weight:850;box-shadow:inset 0 0 0 2px rgba(76,141,246,.35)}
.day.sel .n{background:var(--brand-grad);color:#fff;box-shadow:0 4px 12px rgba(76,141,246,.35)}
.marks{display:flex;gap:3px;margin-top:3px;height:6px}
.marks i{width:6px;height:6px;border-radius:3px;background:#B9C6DC}
.marks i.now{background:var(--now)}
.marks i.soon{background:var(--azure)}
.marks i.rep{background:transparent;box-shadow:inset 0 0 0 1.5px var(--azure)}
.grid.slide-l{animation:slideL .3s cubic-bezier(.2,.8,.2,1)}
.grid.slide-r{animation:slideR .3s cubic-bezier(.2,.8,.2,1)}
@keyframes slideL{from{transform:translateX(36px);opacity:0}}
@keyframes slideR{from{transform:translateX(-36px);opacity:0}}
.cal-jump{margin:14px 0 2px}
.cal-jump .cnt{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:10px;font-size:12px;font-weight:800;background:rgba(76,141,246,.14);color:var(--brand-ink)}
.chip[aria-pressed="true"] .cnt{background:rgba(255,255,255,.25);color:#fff}
.cal-day h4{font-size:17px;font-weight:800;margin:20px 4px 10px}
.cal-day .rows{gap:8px}
.cal-empty{color:var(--ink-2);font-size:15px;margin:6px 4px 4px}
.add-day{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:18px;border:1.5px dashed rgba(76,141,246,.45);color:var(--brand-ink);font-weight:750;font-size:15.5px;margin-top:12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-3);margin:10px 8px 2px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.top-actions{display:flex;align-items:center}

/* ---------- barra delle azioni ---------- */
.dock{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:12;display:flex;align-items:flex-end;gap:24px;padding:10px 22px 8px;border-radius:40px;background:var(--dock);-webkit-backdrop-filter:blur(26px) saturate(1.7);backdrop-filter:blur(26px) saturate(1.7);border:1px solid var(--dock-stroke);box-shadow:0 18px 50px rgba(0,0,0,.25)}
.dock button{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:color-mix(in srgb, var(--dock-ink) 70%, transparent)}
.dock .side .ic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--side);color:var(--dock-ink)}
.dock .cam .ic{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;color:var(--cam-ink);background:var(--cam);box-shadow:var(--cam-glow);margin-top:-24px}
.dock .ic{transition:transform .15s}
.dock button:active .ic{transform:scale(.92)}

/* ---------- fogli ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.42);opacity:0;transition:opacity .3s}
.sheet{position:relative;width:100%;max-width:640px;max-height:92svh;overflow:auto;background:var(--sheet);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border-radius:30px 30px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .42s cubic-bezier(.2,.9,.25,1);overscroll-behavior:contain;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet-wrap.open .scrim{opacity:1}
.sheet-wrap.open .sheet{transform:none}
.grab{width:42px;height:5px;border-radius:3px;background:color-mix(in srgb, var(--ink) 20%, transparent);margin:0 auto 16px}
.sheet h2{font-size:27px;line-height:1.12;font-weight:800;letter-spacing:-.022em;margin:2px 0 8px;text-wrap:balance}
.sheet .lead{font-size:16px;line-height:1.45;color:var(--ink-2);margin:0 0 20px}
.field{margin:0 0 20px}
.field>label,.field>.lbl{display:block;font-size:14.5px;font-weight:750;color:var(--ink-2);margin:0 0 8px}
.pair{display:flex;gap:10px}
.pair>div{min-width:0}
.input{width:100%;height:56px;border-radius:18px;border:1.5px solid transparent;background:var(--field);padding:0 16px;font-size:17.5px;outline:none;-webkit-appearance:none;appearance:none;color:var(--ink)}
.input::placeholder{color:var(--ink-3)}
.input:focus{border-color:var(--brand)}
input[type="date"].input,input[type="time"].input{display:flex;align-items:center;min-width:0;color-scheme:var(--scheme)}
.input.missing{border-color:var(--now-ink)}
textarea.input{height:auto;min-height:100px;padding:14px 16px;line-height:1.4;resize:none}
.summary{background:var(--field);border-radius:20px;padding:14px 16px;margin:4px 0 18px;font-size:15.5px;line-height:1.45}
.summary .row1{display:flex;gap:12px;align-items:flex-start}
.summary svg{flex:0 0 auto;margin-top:2px}
.summary p{margin:0;flex:1}
.summary .chg{font-weight:750;color:var(--brand-ink);text-decoration:underline;text-underline-offset:3px;padding:2px 0;flex:0 0 auto}
.summary .chips{margin-top:12px}
.btn{width:100%;height:58px;border-radius:29px;font-size:17.5px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn-main{background:var(--btn-bg);color:var(--btn-ink);box-shadow:0 10px 26px rgba(76,141,246,.28)}
.btn-main:disabled{opacity:.3}
.btn-ghost{background:var(--field);color:var(--ink);height:52px;font-size:16px;font-weight:700}
.btn-danger{color:var(--now-ink)}
.btn-row{display:flex;gap:10px;margin-top:10px}
.btn-row .btn{flex:1}
.photo-slot{display:flex;gap:12px;align-items:center}
.photo-add{width:100%;height:76px;border-radius:20px;border:1.5px dashed color-mix(in srgb, var(--ink) 22%, transparent);display:flex;align-items:center;justify-content:center;gap:10px;color:var(--ink-2);font-weight:700;font-size:15.5px}
.photo-thumb{width:80px;height:80px;border-radius:18px;object-fit:cover;flex:0 0 80px}
.photo-actions{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.photo-actions button{font-weight:750;font-size:15.5px;padding:4px 0;color:var(--brand-ink)}
.photo-actions button.rm{color:var(--ink-3)}
.thumb{width:100%;max-height:240px;object-fit:cover;border-radius:20px;display:block;margin:0 0 18px}
.scan{display:flex;gap:14px;align-items:center;margin:4px 0 22px}
.scan img{width:84px;height:84px;object-fit:cover;border-radius:18px}
.bar-p{height:6px;border-radius:3px;background:var(--field);overflow:hidden;margin-top:10px}
.bar-p i{display:block;height:100%;width:0;background:var(--brand-grad);transition:width .3s}
.todo{font-size:16px;line-height:1.5;margin:0 0 12px}
.link{display:inline-flex;align-items:center;gap:8px;font-weight:750;color:var(--brand-ink);text-decoration:underline;text-underline-offset:3px;font-size:16px;padding:6px 0}
.d-head{display:flex;flex-direction:column;align-items:center;text-align:center;margin:6px 0 18px}
.d-head .orb{width:76px;height:76px;flex:none;font-size:36px;margin-bottom:12px}
.d-head h2{margin:0 0 6px}
.d-when{font-size:16px;line-height:1.45;color:var(--ink-2);margin:0;max-width:32ch}
.d-when b{color:var(--ink)}
.d-card{background:var(--field);border-radius:22px;padding:16px;margin:0 0 14px}
.d-card .lbl{font-size:14px;font-weight:750;color:var(--ink-3);margin:0 0 6px;display:block}
.examples{display:flex;flex-direction:column;gap:2px;margin:0 0 18px}
.examples button{text-align:left;font-size:15px;color:var(--ink-2);padding:9px 0}
.examples button::before{content:"«"}.examples button::after{content:"»"}
.mic-big{width:104px;height:104px;border-radius:52px;margin:30px auto 20px;display:grid;place-items:center;color:var(--cam-ink);position:relative;background:var(--cam);box-shadow:var(--cam-glow)}
.mic-big.on::before,.mic-big.on::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--azure);animation:ripple 1.8s ease-out infinite}

@keyframes ripple{from{transform:scale(.85);opacity:1}to{transform:scale(1.5);opacity:0}}
.hint{font-size:14.5px;color:var(--ink-2);text-align:center;margin:0 0 16px;line-height:1.4}

.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

.themes .sw{width:100%;aspect-ratio:.62;border-radius:14px;border:2px solid transparent;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(127,127,127,.25)}

.fine{font-size:13px;color:var(--ink-3);text-align:center;margin-top:10px}

/* ---------- toast col nodo ---------- */
.toast{position:fixed;left:14px;right:14px;bottom:calc(118px + env(safe-area-inset-bottom));z-index:30;max-width:560px;margin:0 auto;background:var(--toast-bg);color:var(--toast-ink);border-radius:22px;padding:14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;font-size:15.5px;line-height:1.35;transform:translateY(24px) scale(.96);opacity:0;transition:transform .4s cubic-bezier(.2,.9,.25,1.2),opacity .25s;pointer-events:none;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.toast.show{transform:none;opacity:1;pointer-events:auto}
.toast .msg{flex:1;min-width:0}
.toast .msg b{display:block;font-weight:800}
.toast .msg span{opacity:.65;font-size:14.5px}

#toastActions:empty{display:none}

.toast svg{flex:0 0 46px;height:27px;width:46px;color:#5FE0D3}
.tie use{stroke-dasharray:240;stroke-dashoffset:240}

<script src="parser.js"></script>
<script>
'use strict';
const P = window.MeMoParser;
const $ = s => document.querySelector(s);
const VERSION = '1.3';
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
const isStandalone = () => window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;

// ================= Archivio sul telefono (IndexedDB) =================
const DB = (() => {
  let dbp;
  function open() {
    if (!dbp) dbp = new Promise((res, rej) => {
      const r = indexedDB.open('memo', 1);
      r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('items', { keyPath: 'id' }); d.createObjectStore('photos'); };
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  async function run(store, mode, fn) {
    const d = await open();
    return new Promise((res, rej) => { const t = d.transaction(store, mode); const req = fn(t.objectStore(store)); t.oncomplete = () => res(req ? req.result : undefined); t.onerror = () => rej(t.error); });
  }
  return {
    all: () => run('items', 'readonly', s => s.getAll()),
    put: it => run('items', 'readwrite', s => s.put(it)),
    del: id => run('items', 'readwrite', s => s.delete(id)),
    photoPut: (id, data) => run('photos', 'readwrite', s => s.put(data, id)),
    photoGet: id => run('photos', 'readonly', s => s.get(id)),
    photoDel: id => run('photos', 'readwrite', s => s.delete(id)),
  };
})();
const store = { get(k) { try { return localStorage.getItem('memo.' + k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem('memo.' + k, v); } catch (e) {} } };

let items = [];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const T = id => P.TYPE_BY_ID[id] || P.TYPE_BY_ID.altro;
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function emojiOf(it) {
  const t = (it.title || '').toLowerCase();
  if (it.type === 'appuntamento') {
    if (/parrucch|barbier/.test(t)) return '💇';
    if (/estetist|manicure|massagg/.test(t)) return '💅';
    if (/cena|pranzo|aperitiv|colazione/.test(t)) return '🍽️';
    if (/riunion|meeting|call|colloquio|lavoro|cliente|ufficio/.test(t)) return '💼';
  }
  return T(it.type).emoji;
}
const haptic = (() => { let lbl; return () => { try { if (navigator.vibrate) { navigator.vibrate(12); return; }
  if (!lbl) { const inp = document.createElement('input'); inp.type = 'checkbox'; inp.setAttribute('switch', ''); inp.id = 'hapticSwitch'; inp.style.display = 'none'; lbl = document.createElement('label'); lbl.htmlFor = 'hapticSwitch'; lbl.style.display = 'none'; document.body.append(inp, lbl); }
  lbl.click(); } catch (e) {} }; })();

// ================= Date e orari in parole =================
const pad = n => String(n).padStart(2, '0');
const fmtLong = s => P.parseISO(s).toLocaleDateString('it-IT', { day: 'numeric', month: 'long', year: 'numeric' });
const fmtDay = s => { const sameYear = s.slice(0, 4) === P.todayISO().slice(0, 4); return P.parseISO(s).toLocaleDateString('it-IT', sameYear ? { day: 'numeric', month: 'long' } : { day: 'numeric', month: 'long', year: 'numeric' }); };
const fmtMonth = s => P.parseISO(s).toLocaleDateString('it-IT', { month: 'long', year: 'numeric' });
const hm = d => `${d.getHours()}:${pad(d.getMinutes())}`;
const timeLbl = t => t ? t.replace(/^0(\d)/, '$1') : '';
function dayWord(iso) { const d = P.diffDays(P.todayISO(), iso); return d === 0 ? 'oggi' : d === 1 ? 'domani' : d === -1 ? 'ieri' : null; }
function whenText(it) {
  const w = dayWord(it.due);
  if (it.time) return `${w || 'il ' + fmtDay(it.due)} alle ${timeLbl(it.time)}`;
  return w || `il ${fmtDay(it.due)}`;
}
function remindText(d, timed) {
  const iso = P.toISO(d), w = dayWord(iso), nine = !timed && d.getHours() === 9 && d.getMinutes() === 0;
  if (w === 'oggi') return `alle ${hm(d)}`;
  if (w === 'domani') return `domani alle ${hm(d)}`;
  if (P.diffDays(P.todayISO(), iso) > 300) return `a ${fmtMonth(iso)}`;
  return nine ? `il ${fmtDay(iso)}` : `il ${fmtDay(iso)} alle ${hm(d)}`;
}
function inWords(min) {
  if (min < 0) return '';
  if (min < 60) return min <= 1 ? 'tra un minuto' : `tra ${min} minuti`;
  if (min < 24 * 60) { const h = Math.round(min / 60); return h === 1 ? "tra un'ora" : `tra ${h} ore`; }
  const d = Math.round(min / 1440); if (d < 45) return d === 1 ? 'domani' : `tra ${d} giorni`;
  const m = Math.round(d / 30.44); if (m < 18) return `tra ${m} mesi`;
  return `tra ${Math.round(d / 365.25)} anni`;
}
function countParts(it, st) {
  if (it.time && st.minutesLeft >= 0 && st.minutesLeft < 24 * 60) {
    if (st.minutesLeft < 60) return [st.minutesLeft, 'min'];
    const h = Math.round(st.minutesLeft / 60); return [h, h === 1 ? 'ora' : 'ore'];
  }
  const left = st.left;
  if (left < 0 || (it.time && st.minutesLeft < 0)) return ['!', 'passata'];
  if (left === 0) return ['Oggi', ''];
  if (left < 45) return [left, left === 1 ? 'giorno' : 'giorni'];
  const m = Math.round(left / 30.44); if (m < 18) return [m, 'mesi'];
  const y = Math.round(left / 365.25); return [y, y === 1 ? 'anno' : 'anni'];
}
function rowSub(it, st) {
  if (st.key === 'now') {
    if (it.time) return st.minutesLeft >= 0 ? `${cap(whenText(it))}, ${inWords(st.minutesLeft)}` : `Era ${whenText(it)}`;
    if (st.left < 0) return `Scadenza passata il ${fmtDay(it.due)}`;
    return st.left <= 1 ? `Scade ${dayWord(it.due)}` : `Scade il ${fmtDay(it.due)}`;
  }
  return `Ti avviso ${remindText(st.remind, !!it.time)}`;
}

// ================= Home =================
function countUp(el, to) {
  if (typeof to !== 'number' || matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = to; el.dataset.v = to; return; }
  const from = Number(el.dataset.v || 0); el.dataset.v = to; if (from === to) { el.textContent = to; return; }
  const t0 = performance.now(), dur = 900;
  const step = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = Math.round(from + (to - from) * e); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
let rowObserver = null;
function render() {
  const nowD = new Date();
  const active = items.map(i => ({ i, s: P.statusOf(i, nowD) })).sort((a, b) => P.dueAt(a.i) - P.dueAt(b.i));
  const groups = { now: [], soon: [], calm: [] };
  active.forEach(x => groups[x.s.key].push(x));
  document.body.dataset.mood = !active.length ? 'empty' : groups.now.length ? 'now' : groups.soon.length ? 'soon' : 'calm';

  const num = $('#heroNum'), unit = $('#heroUnit'), knot = $('#heroKnot'), arc = $('#ringArc');
  const h = $('#heroTitle'), p = $('#heroSub'), mini = $('#miniTxt');
  let fill = 0;
  const showNum = on => { num.hidden = unit.hidden = !on; on ? knot.setAttribute('hidden', '') : knot.removeAttribute('hidden'); };
  if (!active.length) {
    showNum(false); fill = 100;
    h.textContent = 'Inizia da una foto.';
    p.textContent = 'Un documento, uno scontrino, un appuntamento. Al resto pensa MeMo.';
    mini.textContent = 'Nessuna scadenza';
  } else if (groups.now.length) {
    const n = groups.now.length, first = groups.now[0];
    showNum(true); fill = 100; countUp(num, n); unit.textContent = 'da sistemare';
    h.textContent = n === 1 ? first.i.title : `${first.i.title} e ${n === 2 ? "un'altra" : 'altre ' + (n - 1)}`;
    p.textContent = n === 1 ? rowSub(first.i, first.s) + '.' : 'Toccale per vedere cosa fare.';
    mini.textContent = n === 1 ? '1 cosa da sistemare' : `${n} cose da sistemare`;
  } else {
    const next = active.slice().sort((a, b) => a.s.remind - b.s.remind)[0];
    const mins = Math.max(0, Math.round((next.s.remind - nowD) / 60000));
    showNum(true);
    if (mins < 24 * 60) {
      const hrs = Math.floor(mins / 60);
      if (hrs >= 1) { countUp(num, hrs); unit.textContent = hrs === 1 ? 'ora tranquilla' : 'ore tranquille'; }
      else { countUp(num, mins); unit.textContent = 'minuti tranquilli'; }
      fill = Math.max(6, mins / (24 * 60) * 100);
      mini.textContent = `Tranquillo fino alle ${hm(next.s.remind)}`;
    } else {
      const d = P.diffDays(P.todayISO(), P.toISO(next.s.remind));
      countUp(num, d); unit.textContent = d === 1 ? 'giorno tranquillo' : 'giorni tranquilli';
      fill = Math.max(8, Math.min(100, d / 90 * 100));
      mini.textContent = d === 1 ? 'Tranquillo fino a domani' : `Tranquillo per ${d} giorni`;
    }
    h.textContent = 'Puoi dimenticarti tutto.';

async function doneItem(it) {
  const ty = T(it.type);
  if (ty.done === 'renew') { openEditor({ id: it.id, type: it.type, title: it.title, date: null }, { head: 'Ottimo. Quando scade il nuovo?', sub: 'Aggiungi la foto del nuovo documento o inserisci la data.', typeLocked: true, markMissing: true }); return false; }
  haptic();
  if (ty.done === 'reschedule') {
    const old = it.due; it.due = P.addMonths(it.due, ty.recur); await DB.put(it); render();
    toast('Fatto. Alla prossima.', `Te lo ricordo di nuovo: ${whenText(it)}.`, [{ label: 'Annulla', fn: async () => { it.due = old; await DB.put(it); render(); } }]);
  } else {
    const photo = it.photoId ? await DB.photoGet(it.photoId) : null;
    await removeItem(it); render();
    toast('Fatto. Una cosa in meno.', null, [{ label: 'Annulla', fn: async () => { await DB.put(it); if (photo) await DB.photoPut(it.photoId, photo); items.push(it); render(); } }]);
  }
  return true;
}
async function removeItem(it) { await DB.del(it.id); if (it.photoId) await DB.photoDel(it.photoId); items = items.filter(x => x.id !== it.id); }
(() => {
  let row = null, x0 = 0, y0 = 0, dx = 0, mode = null, suppress = false;
  const list = $('#list');
  list.addEventListener('touchstart', e => { const r = e.target.closest('.row'); if (!r) return; row = r; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; mode = null; }, { passive: true });
  list.addEventListener('touchmove', e => {
    if (!row) return; const mx = e.touches[0].clientX - x0, my = e.touches[0].clientY - y0;
    if (!mode && (Math.abs(mx) > 8 || Math.abs(my) > 8)) mode = Math.abs(mx) > Math.abs(my) && mx < 0 ? 'x' : 'y';
    if (mode !== 'x') return;
    dx = Math.min(0, mx); row.classList.add('dragging'); row.style.transform = `translateX(${dx}px)`; row.previousElementSibling.style.opacity = Math.min(1, -dx / 110);
  }, { passive: true });
  list.addEventListener('touchend', () => {
    if (!row) return; const r = row; row = null; r.classList.remove('dragging');
    if (mode === 'x') { suppress = true; setTimeout(() => suppress = false, 350); }
    if (mode === 'x' && dx < -110) {

      setTimeout(async () => { if (!(await doneItem(it))) { r.style.transform = ''; r.previousElementSibling.style.opacity = 0; } }, 220);

// ================= Calendario (.ics) =================
function icsText(list) {
  const e = s => String(s).replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;');
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//MeMo//IT', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH'];
  for (const it of list) {
    const ty = T(it.type), d = it.due.replace(/-/g, '');
    const lead = Math.max(0, Math.round((P.dueAt(it) - P.remindAt(it)) / 60000));
    L.push('BEGIN:VEVENT', `UID:${it.id}@memo`, `DTSTAMP:${stamp}`);
    if (it.time) L.push(`DTSTART:${d}T${it.time.replace(':', '')}00`, 'DURATION:PT30M');
    else L.push(`DTSTART;VALUE=DATE:${d}`, `DTEND;VALUE=DATE:${P.addDays(it.due, 1).replace(/-/g, '')}`);
    L.push(`SUMMARY:${e(it.title)}`, `DESCRIPTION:${e(ty.todo || 'Promemoria di MeMo')}`, 'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${e(it.title)}`);
    if (it.time) L.push(`TRIGGER:-PT${lead}M`);
    else { const days = Math.round((P.parseISO(it.due) - P.parseISO(P.toISO(P.remindAt(it)))) / 86400000); L.push(days >= 1 ? `TRIGGER:-P${days - 1}DT15H` : 'TRIGGER:PT9H'); }
    L.push('END:VALARM', 'END:VEVENT');
  }
  L.push('END:VCALENDAR'); return L.join('\r\n');
}
function addToCalendar(list) {
  if (!list.length) { toast("Non c'è ancora niente da aggiungere."); return; }
  const url = URL.createObjectURL(new Blob([icsText(list)], { type: 'text/calendar' }));
  const a = document.createElement('a'); a.href = url; a.rel = 'noopener'; if (!isIOS) a.download = 'memo.ics';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 60000);
}

    { art: `<div class="lead-list"><div>🛂 Passaporto<span>4 mesi prima</span></div><div>🚗 Patente<span>2 mesi prima</span></div><div>💇 Parrucchiere<span>15 min prima</span></div><div>📞 Chiamare Luca<span>5 min prima</span></div></div>`, h: 'E dimenticatelo.', p: 'Ti avvisiamo noi, con il giusto anticipo per ogni cosa. Non prima del necessario.' }
  ];
  if (isIOS && !isStandalone()) slides.push({ art: `<div class="share-art"><span><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4M5 12v8h14v-8"/></svg></span><svg width="22" height="12" viewBox="0 0 22 12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M2 6h17M14 1l5 5-5 5"/></svg><span><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/></svg></span></div>`, h: 'Mettila nella Home.', p: "In Safari tocca Condividi, poi «Aggiungi alla schermata Home». Si apre come un'app vera." });
  const el = document.createElement('div'); el.className = 'intro'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Come funziona MeMo');
  el.innerHTML = `<button class="skip">Salta</button><div class="slides">${slides.map(s => `<section class="slide"><div class="art">${s.art}</div><h2>${s.h}</h2><p>${s.p}</p></section>`).join('')}</div>
    <div class="intro-foot"><div class="dots">${slides.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('')}</div><button class="btn btn-main" id="iNext">Avanti</button></div>`;
  document.body.appendChild(el);
  const sc = el.querySelector('.slides'), dots = el.querySelectorAll('.dots i'), next = el.querySelector('#iNext');
  const idx = () => Math.round(sc.scrollLeft / sc.clientWidth);
  sc.addEventListener('scroll', () => requestAnimationFrame(() => { const i = idx(); dots.forEach((d, k) => d.classList.toggle('on', k === i)); next.textContent = i === slides.length - 1 ? 'Inizia' : 'Avanti'; }), { passive: true });
  const close = () => { store.set('intro', '1'); el.style.transition = 'opacity .35s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 350); };
  next.onclick = () => { const i = idx(); if (i >= slides.length - 1) close(); else sc.scrollTo({ left: (i + 1) * sc.clientWidth, behavior: 'smooth' }); };
  el.querySelector('.skip').onclick = close;
}

// ================= Avvisi mentre l'app è aperta =================
const alerted = new Set();
function tick() {
  const nowD = new Date();
  for (const it of items) {
    const r = P.remindAt(it), key = it.id + '@' + r.getTime();
    if (r <= nowD && nowD - r < 3 * 60000 && !alerted.has(key)) { alerted.add(key); haptic(); toast(`È ora: ${it.title}`, rowSub(it, P.statusOf(it, nowD))); }
  }
  render();
}

// ================= Avvio =================
(async function init() {
  renderStarter();
  try { items = await DB.all(); } catch (e) { items = []; }
  $('#viewLinea').hidden = view !== 'linea'; $('#viewCal').hidden = view !== 'cal';
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-selected', b.dataset.v === view));
  render();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  if (isIOS && !isStandalone() && store.get('installHint') !== '1') $('#installHint').hidden = false;
  $('#installClose').onclick = () => { $('#installHint').hidden = true; store.set('installHint', '1'); };
  if (store.get('intro') !== '1' && !new URLSearchParams(location.search).has('nointro')) showIntro();
  setInterval(tick, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
