<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MeMo</title>
<meta name="description" content="Fai una foto, detta una scadenza e dimenticatela: ti avvisa MeMo quando è il momento.">
<meta name="theme-color" content="#F3F6FA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MeMo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
@property --mood1 { syntax: '<color>'; inherits: true; initial-value: #4ADBA2; }
@property --mood2 { syntax: '<color>'; inherits: true; initial-value: #6FC3F3; }

/* ================= COLORI: Giorno, tarato sull'icona ================= */
:root{
  --bg:#F3F6FA; --ink:#121826; --ink-2:rgba(18,24,38,.62); --ink-3:rgba(18,24,38,.42);
  --violet:#2F6BF2; --azure:#4C8DF6; --teal:#2FCDBE;
  --brand:#4C8DF6; --brand-ink:#2F6FE0; --brand-grad:linear-gradient(135deg,#2F6BF2 0%,#4C8DF6 52%,#2FCDBE 100%);
  --card:#FFFFFF; --card-press:#F6F8FC; --stroke:rgba(18,24,38,.06); --card-shadow:0 1px 2px rgba(18,24,38,.04), 0 10px 30px rgba(43,72,140,.06);
  --orb:#F1F4FA; --sheet:rgba(255,255,255,.97); --field:#F1F4F9;
  --dock:rgba(255,255,255,.8); --dock-stroke:rgba(18,24,38,.06); --dock-ink:#121826; --side:#EEF2F8;
  --cam:var(--brand-grad); --cam-ink:#fff; --cam-glow:0 0 0 6px rgba(76,141,246,.14), 0 12px 30px rgba(47,107,242,.38);
  --btn-bg:var(--brand-grad); --btn-ink:#fff; --toast-bg:#121826; --toast-ink:#fff;
  --calm:#4C9AF6; --calm-2:#4FD0C6; --soon:#4C8DF6; --soon-2:#35B6E8; --now:#2F6BF2; --now-2:#35B6E8; --empty:#3D86F4; --empty-2:#4FD0C6;
  --now-ink:#2559D6; --soon-ink:#2F6FE0; --thread:#4C8DF6;
  --aurora:.38; --ring-track:rgba(18,24,38,.06); --ring-w:7; --num-w:850; --num-fill:linear-gradient(165deg,#121826 32%,var(--mood2) 70%,var(--mood1)); --glow:none;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --scheme:light;
}
body{--mood1:var(--calm);--mood2:var(--calm-2);transition:--mood1 1.4s ease, --mood2 1.4s ease}
body[data-mood="now"]{--mood1:var(--now);--mood2:var(--now-2)}
body[data-mood="soon"]{--mood1:var(--soon);--mood2:var(--soon-2)}
body[data-mood="empty"]{--mood1:var(--empty);--mood2:var(--empty-2)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color-scheme:var(--scheme)}
html,body{margin:0;color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;text-size-adjust:100%}
body{min-height:100svh;background:var(--bg);overscroll-behavior-y:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--mood1);outline-offset:2px;border-radius:14px}
[hidden]{display:none!important}

/* ---------- luce di sfondo ---------- */
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:calc(var(--aurora) * (1 - var(--p, 0) * .55))}
.aurora i{position:absolute;width:95vmax;height:95vmax;border-radius:50%}
.aurora i:nth-child(1){background:radial-gradient(circle, var(--mood1) 0%, transparent 58%);top:-48vmax;left:-38vmax;animation:drift1 19s ease-in-out infinite alternate}
.aurora i:nth-child(2){background:radial-gradient(circle, var(--mood2) 0%, transparent 58%);top:-18vmax;right:-55vmax;animation:drift2 23s ease-in-out infinite alternate;opacity:.75}
/* ogni tanto un pesciolino passa lontano, sullo sfondo */
.swimmer{position:fixed;left:0;top:0;z-index:0;pointer-events:none;opacity:0;width:40px;height:40px;margin:-20px 0 0 -20px;will-change:transform}
.swimmer .bob{width:100%;height:100%;filter:saturate(.95)}
.swimmer svg{width:100%;height:100%;overflow:visible}
.swimmer .tail{transform-box:view-box;transform-origin:30px 58px;animation:swTail .22s ease-in-out infinite alternate}
@keyframes swTail{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
@keyframes drift1{to{transform:translate(18vmax,14vmax) scale(1.12)}}
@keyframes drift2{to{transform:translate(-14vmax,18vmax) scale(.92)}}

/* ---------- barra in alto ---------- */
/* l'iPhone colora da sé la fascia dell'orologio: qui la si raccorda al cielo di MeMo, senza stacco */
.topfade{position:fixed;top:0;left:0;right:0;height:calc(env(safe-area-inset-top) + 96px);z-index:9;pointer-events:none;background:linear-gradient(180deg,#D8DFEC 0%,rgba(216,223,236,.78) 28%,rgba(216,223,236,.32) 62%,rgba(216,223,236,0) 100%)}
.bar{position:fixed;top:0;left:0;right:0;z-index:10;height:calc(env(safe-area-inset-top) + 54px);padding:env(safe-area-inset-top) 10px 0 18px;display:flex;align-items:center;justify-content:space-between}
.bar::before{content:"";position:absolute;inset:0;background:color-mix(in srgb, var(--bg) 72%, transparent);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);opacity:var(--p2, 0)}
.brand{position:relative;display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;letter-spacing:-.01em;opacity:calc(1 - var(--p2, 0))}
.brand svg{display:none}
.mini{position:absolute;left:20px;top:calc(env(safe-area-inset-top) + 27px);transform:translateY(-50%) translateY(calc((1 - var(--p2, 0)) * 8px));opacity:var(--p2, 0);display:flex;align-items:center;gap:8px;font-weight:750;font-size:15px;white-space:nowrap;pointer-events:none}
.mini .dot{width:9px;height:9px;border-radius:50%;background:var(--mood1);box-shadow:0 0 0 2px color-mix(in srgb, var(--ink) 10%, transparent)}
.icon-btn{position:relative;width:44px;height:44px;border-radius:22px;display:grid;place-items:center;color:var(--ink-2)}
.icon-btn:active{background:var(--card-press)}

/* ---------- schermata principale a pieno schermo ---------- */
.hero{position:sticky;top:0;height:100svh;z-index:1;display:grid;place-items:center;padding:calc(env(safe-area-inset-top) + 34px) 28px calc(210px + env(safe-area-inset-bottom));scroll-snap-align:start;scroll-snap-stop:always}
.hero-inner{text-align:center;transform-origin:50% 40%;will-change:transform,opacity;max-width:430px}
.ring{position:relative;width:min(64vw,260px,36svh);aspect-ratio:1;margin:0 auto 26px}
.ring svg.r{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ring .track{fill:none;stroke:var(--ring-track);stroke-width:var(--ring-w)}
.ring .arc{fill:none;stroke:url(#ringGrad);stroke-width:var(--ring-w);stroke-linecap:round;transition:stroke-dashoffset 1.6s cubic-bezier(.2,.8,.2,1);filter:var(--glow)}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num{font-size:clamp(70px,24vw,112px);line-height:.9;font-weight:var(--num-w);letter-spacing:-.06em;background:var(--num-fill);-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.ring .unit{font-size:14.5px;font-weight:700;color:var(--ink-2);margin-top:10px}
.ring .knot{width:64%;filter:drop-shadow(0 10px 18px rgba(242,87,58,.22));animation:swim 5s ease-in-out infinite}
@keyframes swim{50%{transform:translate(4px,-5px) rotate(-3deg)}}
.hero h1{font-size:clamp(25px,7vw,32px);line-height:1.08;font-weight:800;letter-spacing:-.025em;margin:0 0 10px;text-wrap:balance}
.hero h1 .h2l{display:block;white-space:nowrap}
.hero h1 .brandw{background:linear-gradient(120deg,#2F6BF2,#4C8DF6 55%,#2FCDBE);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-size:16.5px;line-height:1.45;color:var(--ink-2);margin:0 auto;max-width:30ch;text-wrap:pretty}
.peek{position:fixed;left:0;right:0;bottom:calc(168px + env(safe-area-inset-bottom) - var(--kbfix, 0px));z-index:3;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;font-weight:700;color:var(--ink-3);opacity:calc(1 - var(--p, 0) * 3)}
.peek svg{animation:cue 2.4s ease-in-out infinite}
@keyframes cue{50%{transform:translateY(4px)}}

/* ---------- la linea delle scadenze ---------- */
.list-sec{position:relative;z-index:2;min-height:100svh;padding:calc(env(safe-area-inset-top) + 62px) 16px calc(150px + env(safe-area-inset-bottom));scroll-snap-align:start;scroll-snap-stop:always}
.list-sec::before{content:"";position:absolute;left:0;right:0;top:-45svh;height:45svh;background:linear-gradient(to bottom, transparent, var(--bg));pointer-events:none}
.list-sec::after{content:"";position:absolute;inset:0;background:var(--bg);z-index:-1}
.wrap{max-width:620px;margin:0 auto}
.list-title{font-size:27px;font-weight:800;letter-spacing:-.025em;margin:4px 4px 18px;white-space:nowrap}
.thread{position:relative}
.thread::before{content:"";position:absolute;left:37px;top:var(--t-top,0);bottom:var(--t-bot,0);width:2.5px;background:linear-gradient(to bottom,var(--violet),var(--azure),var(--teal));border-radius:2px;opacity:.9}
.thread:empty::before{display:none}
.group{margin:0 0 12px}
.group h2{font-size:14.5px;font-weight:750;color:var(--ink-3);margin:12px 0 8px 76px}
.rows{display:flex;flex-direction:column;gap:8px}
.row-wrap{position:relative;border-radius:22px;overflow:hidden;opacity:0;transform:translateY(18px);transition:opacity .6s ease, transform .6s cubic-bezier(.2,.8,.2,1)}
.row-wrap.in{opacity:1;transform:none}
.swipe-bg{position:absolute;inset:0;border-radius:22px;background:linear-gradient(90deg,transparent 25%,#3CCB8F);display:flex;align-items:center;justify-content:flex-end;padding-right:22px;font-weight:800;color:#06281A;opacity:0}
.row{position:relative;display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 14px;border-radius:22px;background:var(--card);border:1px solid var(--stroke);box-shadow:var(--card-shadow);transition:transform .25s cubic-bezier(.2,.8,.2,1),background .2s;touch-action:pan-y}
.row:active{background:var(--card-press)}
.row.dragging{transition:none}
.orb{flex:0 0 48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--orb);border:1.5px solid color-mix(in srgb, var(--ink) 12%, transparent);position:relative;z-index:1}
.row[data-s="now"] .orb{border-color:var(--now-ink);box-shadow:0 0 0 4px color-mix(in srgb, var(--now) 22%, transparent)}
.row[data-s="soon"] .orb{border-color:rgba(76,141,246,.55)}
.row .txt{flex:1;min-width:0}
.row .t{display:block;font-size:17px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{display:block;font-size:14px;color:var(--ink-2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{flex:0 0 auto;text-align:right;line-height:1;min-width:44px}
.count b{display:block;font-size:24px;font-weight:850;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.count span{display:block;font-size:11.5px;font-weight:700;color:var(--ink-3);margin-top:3px}
.row[data-s="now"] .count b,.row[data-s="now"] .s{color:var(--now-ink)}
.row[data-s="soon"] .count b{color:var(--soon-ink)}
.tip{font-size:13px;color:var(--ink-3);text-align:center;margin:16px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:10px 14px 10px 12px;border-radius:999px;background:var(--card);border:1px solid var(--stroke);box-shadow:var(--card-shadow);font-size:15px;font-weight:650;white-space:nowrap;transition:transform .15s,background .2s}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.chips.scroll{position:relative;flex-wrap:nowrap;overflow-x:auto;margin:0 -20px;padding:2px 20px 8px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.install{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--stroke);border-radius:20px;padding:14px 10px 14px 16px;margin:22px 0 0;font-size:15px;line-height:1.4;color:var(--ink-2)}
.install p{margin:0;flex:1}.install b{color:var(--ink);font-weight:700}

/* ---------- intestazione lista e calendario ---------- */
.list-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 4px 18px}
.list-head .list-title{margin:0}
.cal{background:var(--card);border-radius:24px;box-shadow:var(--card-shadow);padding:14px 10px 10px;border:1px solid var(--stroke);touch-action:pan-y}
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px 8px}
.cal-head h3{margin:0;font-size:20px;font-weight:800;letter-spacing:-.015em}
.cal-nav{display:flex;align-items:center;gap:2px}
.cal-nav button{min-width:38px;height:38px;border-radius:19px;display:grid;place-items:center;color:var(--ink-2)}
.cal-nav button:active{background:var(--field)}
.cal-nav .cal-today{font-size:14px;font-weight:750;color:var(--brand-ink);padding:0 10px}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.dow span{text-align:center;font-size:12px;font-weight:750;color:var(--ink-3);padding:2px 0 6px}
.day{position:relative;height:50px;display:flex;flex-direction:column;align-items:center;padding-top:4px;border-radius:14px;font-size:16px;font-weight:650;font-variant-numeric:tabular-nums;color:var(--ink)}
.day:active{background:var(--field)}
.day.out{visibility:hidden}
.day.past{color:var(--ink-3)}
.day .n{width:32px;height:32px;display:grid;place-items:center;border-radius:16px}
.day.today .n{color:var(--brand-ink);font-weight:850;box-shadow:inset 0 0 0 2px rgba(76,141,246,.35)}
.day.sel .n{background:var(--brand-grad);color:#fff;box-shadow:0 4px 12px rgba(76,141,246,.35)}
.marks{display:flex;gap:3px;margin-top:3px;height:6px}
.marks i{width:6px;height:6px;border-radius:3px;background:#B9C6DC}
.marks i.now{background:var(--now)}
.marks i.soon{background:var(--azure)}
.marks i.rep{background:transparent;box-shadow:inset 0 0 0 1.5px var(--azure)}
.grid.slide-l{animation:slideL .3s cubic-bezier(.2,.8,.2,1)}
.grid.slide-r{animation:slideR .3s cubic-bezier(.2,.8,.2,1)}
@keyframes slideL{from{transform:translateX(36px);opacity:0}}
@keyframes slideR{from{transform:translateX(-36px);opacity:0}}
.cal-jump{margin:26px 0 4px}
.cal-jump .cnt{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:10px;font-size:12px;font-weight:800;background:rgba(76,141,246,.14);color:var(--brand-ink)}
.chip[aria-pressed="true"] .cnt{background:rgba(255,255,255,.25);color:#fff}
.cal-day h4{font-size:17px;font-weight:800;margin:20px 4px 10px}
.cal-day .rows{gap:8px}
.cal-empty{color:var(--ink-2);font-size:15px;margin:6px 4px 4px}
.add-day{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:18px;border:1.5px dashed rgba(76,141,246,.45);color:var(--brand-ink);font-weight:750;font-size:15.5px;margin-top:12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-3);margin:10px 8px 2px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.top-actions{display:flex;align-items:center}

/* ---------- calendario: pagina affiancata a sinistra, stesso sfondo ---------- */
:root{--hx:0px}
.hero,.list-sec,.peek,.bar{translate:var(--hx) 0}
.calp{position:fixed;inset:0;z-index:11;background:transparent;overflow-y:auto;overscroll-behavior:contain;translate:calc(var(--hx) - 100vw) 0;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(170px + env(safe-area-inset-bottom));pointer-events:none}
.calp.open{pointer-events:auto}
.hero,.list-sec,.peek,.bar,.calp{will-change:translate}
html,body{overflow-x:clip}
html{overflow-x:hidden}
.calp-head{display:flex;align-items:center;justify-content:space-between;max-width:620px;margin:0 auto 10px;min-height:44px}
.calp-head h2{margin:0;font-size:27px;font-weight:800;letter-spacing:-.025em}
.calp-head .icon-btn{margin-right:-10px;color:var(--ink)}
.calp-head .icon-btn.back{margin:0 0 0 -10px}
.setp{translate:calc(var(--hx) + 100vw) 0}
.setp .s-block{background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.7)}
.setp .s-block .btn{background:rgba(255,255,255,.6)}
.setp .s-block .btn.btn-main{background:var(--brand-grad);color:#fff}
.g-steps{margin:0 0 18px;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;counter-reset:g}
.g-steps li{counter-increment:g;display:grid;grid-template-columns:30px 1fr;gap:2px 10px;align-items:start}
.g-steps li::before{grid-row:1 / span 2}
.g-steps li::before{content:counter(g);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--field);color:var(--brand-ink);font-weight:800;font-size:14px}
.g-alt li::before{content:'•'}
.g-steps li > b{display:block;font-size:16px;grid-column:2;grid-row:1}
.g-steps li p{grid-column:2;margin:2px 0 0;color:var(--ink-2);font-size:14.5px;line-height:1.45}
.g-steps li p b{color:var(--ink);font-weight:750}
.g-steps code{font:600 13px ui-monospace,Menlo,monospace;background:var(--field);padding:1px 5px;border-radius:6px}
.g-h{font-size:18px;margin:6px 0 12px}
.mic-help{margin-top:8px;padding:8px 14px;border-radius:999px;background:var(--field);color:var(--brand-ink);font-weight:700;font-size:14px}
.s-row{display:flex;gap:14px;align-items:center;justify-content:space-between}
.s-row p{margin-bottom:0}
.sw{appearance:none;-webkit-appearance:none;flex:0 0 auto;width:51px;height:31px;border-radius:16px;background:#D5DBE5;position:relative;cursor:pointer;transition:background .25s;margin:0}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18);transition:transform .25s cubic-bezier(.3,.9,.3,1.2)}
.sw:checked{background:var(--brand-ink)}
.sw:checked::after{transform:translateX(20px)}
.sw:focus-visible{outline:3px solid var(--azure);outline-offset:2px}
.ok-pill{display:inline-block;margin-left:6px;padding:2px 9px;border-radius:999px;background:rgba(47,205,190,.18);color:#118C80;font-size:12.5px;font-weight:800;vertical-align:2px}
/* calendario leggero: vetro trasparente al posto del bianco pieno */
.calp .cal{background:rgba(255,255,255,.48);border:1px solid rgba(255,255,255,.7);box-shadow:0 8px 30px rgba(43,72,140,.07)}
.calp .row,.calp .chip:not([aria-pressed="true"]){background:rgba(255,255,255,.45);border-color:rgba(255,255,255,.65);box-shadow:none}
.calp .chip{box-shadow:none}
/* il pannello scorre solo su e giù: niente trascinamenti di lato o in diagonale */
.calp{overflow-x:hidden;touch-action:pan-y}
.calp .chips.scroll{margin:0 -16px;padding:2px 16px 10px;touch-action:pan-x pan-y}
.calp .cal-jump .chip:not([aria-pressed="true"]){background:rgba(255,255,255,.78);border-color:rgba(255,255,255,.95);color:var(--ink)}
.calp .cal-jump .chip{font-size:15.5px;font-weight:700;padding:11px 15px 11px 14px}
.calp .cal-jump .cnt{background:rgba(47,107,242,.16);color:var(--brand-ink)}
.calp .cal-jump .chip[aria-pressed="true"] .cnt{background:rgba(255,255,255,.28);color:#fff}
.cal-jump-h{font-size:15px;font-weight:750;color:var(--ink-2);margin:28px 4px 10px}
.cal-jump-h + .cal-jump{margin-top:0}
.calp .day:active{background:rgba(255,255,255,.5)}
.calp .add-day{border-color:rgba(76,141,246,.35);background:rgba(255,255,255,.18)}
.dock{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom) - var(--kbfix, 0px));z-index:12;display:flex;align-items:flex-end;justify-content:center;gap:34px;pointer-events:none}
.dock .rb{pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;font-weight:750;color:var(--ink-2)}
.dock .c{display:grid;place-items:center;border-radius:50%;transition:transform .15s}
.dock .photo .c{width:62px;height:62px;color:#fff;background:linear-gradient(135deg,#4C8DF6,#2FCDBE);box-shadow:0 10px 24px rgba(47,205,190,.35), inset 0 1px 0 rgba(255,255,255,.3)}

<script>
'use strict';
const P = window.MeMoParser;
const $ = s => document.querySelector(s);
const VERSION = '1.31';
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
const isStandalone = () => window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;

// ================= Archivio sul telefono (IndexedDB) =================
const DB = (() => {
  let dbp;
  function open() {
    if (!dbp) dbp = new Promise((res, rej) => {
      const r = indexedDB.open('memo', 1);
      r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('items', { keyPath: 'id' }); d.createObjectStore('photos'); };
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  async function run(store, mode, fn) {
    const d = await open();
    return new Promise((res, rej) => { const t = d.transaction(store, mode); const req = fn(t.objectStore(store)); t.oncomplete = () => res(req ? req.result : undefined); t.onerror = () => rej(t.error); });
  }
  return {
    all: () => run('items', 'readonly', s => s.getAll()),
    put: it => run('items', 'readwrite', s => s.put(it)),
    del: id => run('items', 'readwrite', s => s.delete(id)),
    photoPut: (id, data) => run('photos', 'readwrite', s => s.put(data, id)),
    photoGet: id => run('photos', 'readonly', s => s.get(id)),
    photoDel: id => run('photos', 'readwrite', s => s.delete(id)),
  };
})();
const store = { get(k) { try { return localStorage.getItem('memo.' + k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem('memo.' + k, v); } catch (e) {} } };

let items = [];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const T = id => P.TYPE_BY_ID[id] || P.TYPE_BY_ID.altro;
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function emojiOf(it) {
  const t = (it.title || '').toLowerCase();
  if (it.type === 'appuntamento') {
    if (/parrucch|barbier/.test(t)) return '💇';
    if (/estetist|manicure|massagg/.test(t)) return '💅';
    if (/cena|pranzo|aperitiv|colazione/.test(t)) return '🍽️';
    if (/riunion|meeting|call|colloquio|lavoro|cliente|ufficio/.test(t)) return '💼';
  }
  return T(it.type).emoji;
}
const haptic = (() => { let lbl; return () => { try { if (navigator.vibrate) { navigator.vibrate(12); return; }
  if (!lbl) { const inp = document.createElement('input'); inp.type = 'checkbox'; inp.setAttribute('switch', ''); inp.id = 'hapticSwitch'; inp.style.display = 'none'; lbl = document.createElement('label'); lbl.htmlFor = 'hapticSwitch'; lbl.style.display = 'none'; document.body.append(inp, lbl); }
  lbl.click(); } catch (e) {} }; })();

// ================= Date e orari in parole =================
const pad = n => String(n).padStart(2, '0');
const fmtLong = s => P.parseISO(s).toLocaleDateString('it-IT', { day: 'numeric', month: 'long', year: 'numeric' });
const fmtDay = s => { const sameYear = s.slice(0, 4) === P.todayISO().slice(0, 4); return P.parseISO(s).toLocaleDateString('it-IT', sameYear ? { day: 'numeric', month: 'long' } : { day: 'numeric', month: 'long', year: 'numeric' }); };
const fmtMonth = s => P.parseISO(s).toLocaleDateString('it-IT', { month: 'long', year: 'numeric' });
const hm = d => `${d.getHours()}:${pad(d.getMinutes())}`;
const timeLbl = t => t ? t.replace(/^0(\d)/, '$1') : '';
function dayWord(iso) { const d = P.diffDays(P.todayISO(), iso); return d === 0 ? 'oggi' : d === 1 ? 'domani' : d === -1 ? 'ieri' : null; }
function whenText(it) {
  const w = dayWord(it.due);
  if (it.time) return `${w || 'il ' + fmtDay(it.due)} alle ${timeLbl(it.time)}`;
  return w || `il ${fmtDay(it.due)}`;
}
function remindText(d, timed) {
  const iso = P.toISO(d), w = dayWord(iso), nine = !timed && d.getHours() === 9 && d.getMinutes() === 0;
  if (w === 'oggi') return `alle ${hm(d)}`;
  if (w === 'domani') return `domani alle ${hm(d)}`;
  if (P.diffDays(P.todayISO(), iso) > 300) return `a ${fmtMonth(iso)}`;
  return nine ? `il ${fmtDay(iso)}` : `il ${fmtDay(iso)} alle ${hm(d)}`;
}
// solo le vere scadenze "scadono": un parrucchiere o una commissione no
const DEADLINE = new Set(['passaporto', 'cie', 'patente', 'tessera', 'revisione', 'bollo', 'assicurazione', 'caldaia', 'abbonamento', 'bolletta', 'garanzia']);
function inWords(min) {
  if (min < 0) return '';
  if (min < 60) return min <= 1 ? 'tra un minuto' : `tra ${min} minuti`;
  if (min < 24 * 60) { const h = Math.round(min / 60); return h === 1 ? "tra un'ora" : `tra ${h} ore`; }
  const d = Math.round(min / 1440); if (d < 45) return d === 1 ? 'domani' : `tra ${d} giorni`;
  const m = Math.round(d / 30.44); if (m < 18) return `tra ${m} mesi`;
  return `tra ${Math.round(d / 365.25)} anni`;
}
function countParts(it, st) {
  if (it.time && st.minutesLeft >= 0 && st.minutesLeft < 24 * 60) {
    if (st.minutesLeft < 60) return [st.minutesLeft, 'min'];
    const h = Math.round(st.minutesLeft / 60); return [h, h === 1 ? 'ora' : 'ore'];
  }
  const left = st.left;
  if (left < 0 || (it.time && st.minutesLeft < 0)) return ['!', 'passata'];
  if (left === 0) return ['Oggi', ''];
  if (left < 45) return [left, left === 1 ? 'giorno' : 'giorni'];
  const m = Math.round(left / 30.44); if (m < 18) return [m, 'mesi'];
  const y = Math.round(left / 365.25); return [y, y === 1 ? 'anno' : 'anni'];
}
function rowSub(it, st) {
  if (st.key === 'now') {
    if (it.time) return st.minutesLeft >= 0 ? cap(whenText(it)) : `Era ${whenText(it)}`;
    const exp = ['passaporto', 'cie', 'patente', 'tessera', 'revisione', 'bollo', 'assicurazione', 'abbonamento', 'bolletta', 'garanzia'].includes(it.type);
    if (st.left < 0) return exp ? `Scaduto il ${fmtDay(it.due)}` : `Era il ${fmtDay(it.due)}`;
    if (st.left <= 1) return exp ? `Scade ${dayWord(it.due)}` : cap(dayWord(it.due));
    return exp ? `Scade il ${fmtDay(it.due)}` : `Il ${fmtDay(it.due)}`;
  }
  return `Ti avviso ${remindText(st.remind, !!it.time)}`;
}

// ================= Home =================
function countUp(el, to) {
  if (typeof to !== 'number' || matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = to; el.dataset.v = to; return; }
  const from = Number(el.dataset.v || 0); el.dataset.v = to; if (from === to) { el.textContent = to; return; }
  const t0 = performance.now(), dur = 900;
  const step = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = Math.round(from + (to - from) * e); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
let rowObserver = null;
// il logo serve ancora per gli avvisi dentro l'app, ma in alto resta solo la scritta MeMo
const LOGO_SVG = (() => { const el = document.querySelector('.brand svg'); const h = el ? el.outerHTML.replace(/display:\s*none;?/, '') : ''; if (el) el.remove(); return h; })();
const CALM_LINES = ['Tutto sotto controllo.', 'Ho tutto sotto pinna.', 'Me lo sono segnato io.', 'Tranquillo, ce l\'ho io.', 'Lascia fare a me.', 'Tu vivi, io ricordo.', 'Nessun pensiero: ci sono io.'];
const CALM_LINE = CALM_LINES[Math.floor(Math.random() * CALM_LINES.length)];
// la frase sotto: parla come un amico che ti avvisa, e cambia parole ogni volta che apri l'app
const SAY_LEAD = ['Ricordati {x}.', 'Non scordarti {x}.', 'Mi raccomando: ricordati {x}.', 'Non dimenticarti {x}.'];
const SAY_TAIL1 = ['Te lo ricordo io al momento giusto.', 'Quando sarà ora, ti avviso io.', 'Tu non pensarci: ti faccio un fischio io.', 'Al momento giusto ci penso io.', 'Ti avviso io, con calma.'];
const SAY_TAILN = ['Te li ricordo io al momento giusto.', 'Quando sarà ora, ti avviso io.', 'Tu non pensarci: ti faccio un fischio io.', 'Al momento giusto ci penso io.', 'Ti avviso io, uno alla volta.'];
const SAY_SEED = [Math.random(), Math.random()];
const sayPick = (arr, k) => arr[Math.floor(SAY_SEED[k] * arr.length)];
function tellLine(list) {
  const two = list.slice().sort((a, b) => P.dueAt(a) - P.dueAt(b)).slice(0, 2);
  const parts = two.map(it => P.phraseOf(it) + (it.time ? ' alle ' + timeLbl(it.time) : ''));
  return sayPick(SAY_LEAD, 0).replace('{x}', parts.join(' e ')) + ' ' + sayPick(two.length === 1 ? SAY_TAIL1 : SAY_TAILN, 1);
}
function render() {
  const nowD = new Date();
  const active = items.map(i => ({ i, s: P.statusOf(i, nowD) })).sort((a, b) => P.dueAt(a.i) - P.dueAt(b.i));
  const groups = { now: [], soon: [], calm: [] };
  active.forEach(x => groups[x.s.key].push(x));
  document.body.dataset.mood = !active.length ? 'empty' : groups.now.length ? 'now' : groups.soon.length ? 'soon' : 'calm';

  const num = $('#heroNum'), unit = $('#heroUnit'), knot = $('#heroKnot'), arc = $('#ringArc');
  const h = $('#heroTitle'), p = $('#heroSub'), mini = $('#miniTxt');
  let fill = 0;
  const showNum = on => { num.hidden = unit.hidden = !on; on ? knot.setAttribute('hidden', '') : knot.removeAttribute('hidden'); };
  if (!active.length) {
    showNum(false); fill = 100;
    h.innerHTML = 'Dimmi cosa ricordarti.<span class="h2l">Al resto ci pensa <span class="brandw">MeMo</span>.</span>';
    p.textContent = 'Scadenze, appuntamenti, documenti. Te li ricordo io.';
    mini.textContent = 'Nessuna scadenza';
  } else if (groups.now.length) {
    const n = groups.now.length, first = groups.now[0];
    const today = P.todayISO(), allToday = groups.now.every(x => x.i.due === today);
    showNum(true); fill = 100; countUp(num, n);
    unit.textContent = allToday ? 'MeMo per oggi' : (n === 1 ? 'MeMo da ricordare' : 'MeMo da ricordare');
    h.textContent = n === 1 ? first.i.title : `${first.i.title} e ${n === 2 ? "un'altra cosa" : (n - 1) + ' altre cose'}`;
    p.textContent = n === 1 ? `${rowSub(first.i, first.s)}. Ci penso io.` : 'Li trovi qui sotto. Ci penso io.';
    mini.textContent = `${n} MeMo ${allToday ? 'per oggi' : 'da ricordare'}`;
  } else {
    // quanti MeMo ci sono nel prossimo giorno che ne ha: oggi, domani, oppure tra qualche giorno
    const today = P.todayISO(), next = active[0], day = next.i.due;
    const sameDay = active.filter(x => x.i.due === day), n = sameDay.length;
    const days = P.diffDays(today, day);
    fill = 100;
    if (days > 183) {
      showNum(false);
      h.textContent = 'Troppo in là anche solo per ricordartelo.';
      p.textContent = `Il prossimo MeMo è a ${fmtMonth(day)}. Ci penso io.`;
      mini.textContent = 'Niente in vista';
    } else {
      showNum(true); countUp(num, n);
      const when = days <= 0 ? 'per oggi' : days === 1 ? 'per domani' : days < 45 ? `tra ${days} giorni` : `tra ${Math.round(days / 30.44)} mesi`;
      unit.textContent = `MeMo ${when}`;
      h.textContent = CALM_LINE;
      p.textContent = tellLine(sameDay.map(x => x.i));
      mini.textContent = `${n} MeMo ${when}`;
    }
  }
  requestAnimationFrame(() => arc.style.strokeDashoffset = String(100 - fill));

  $('#peekTxt').textContent = active.length === 1 ? 'Il tuo MeMo' : `I tuoi ${active.length} MeMo`;
  $('#peek').hidden = !active.length; $('#listSec').hidden = !active.length;
  const names = { now: 'Adesso', soon: 'Prossimamente', calm: 'Più avanti' };
  const list = $('#list');
  list.innerHTML = ['now', 'soon', 'calm'].filter(k => groups[k].length).map(k => `
    <section class="group"><h2>${names[k]}</h2><div class="rows">
      ${groups[k].map(({ i, s }) => { const [cn, cu] = countParts(i, s); return `
        <div class="row-wrap"><div class="swipe-bg">Fatto</div>
        <button class="row" data-s="${s.key}" data-id="${i.id}">
          <span class="orb" aria-hidden="true">${emojiOf(i)}</span>
          <span class="txt"><span class="t">${esc(i.title)}</span><span class="s">${esc(rowSub(i, s))}</span></span>
          <span class="count"><b>${cn}</b><span>${cu}</span></span>
        </button></div>`; }).join('')}
    </div></section>`).join('');
  const orbs = list.querySelectorAll('.orb');
  if (orbs.length) {
    const r = list.getBoundingClientRect(), f = orbs[0].getBoundingClientRect(), l = orbs[orbs.length - 1].getBoundingClientRect();
    list.style.setProperty('--t-top', (f.top - r.top + f.height / 2) + 'px');
    list.style.setProperty('--t-bot', (r.bottom - l.bottom + l.height / 2) + 'px');
  }
  if (rowObserver) rowObserver.disconnect();
  if ('IntersectionObserver' in window) {
    rowObserver = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); rowObserver.unobserve(e.target); } }), { rootMargin: '0px 0px -6% 0px' });
    list.querySelectorAll('.row-wrap').forEach((el, k) => { el.style.transitionDelay = Math.min(k, 6) * 45 + 'ms'; rowObserver.observe(el); });
  } else list.querySelectorAll('.row-wrap').forEach(el => el.classList.add('in'));
  $('#swipeTip').hidden = !active.length || store.get('swiped') === '1';
  try { if ('setAppBadge' in navigator) groups.now.length ? navigator.setAppBadge(groups.now.length) : navigator.clearAppBadge(); } catch (e) {}
  if (calOpen) renderCal();
  onScroll();
  Push.later();
}

// ---------- scorrendo: lo stato svanisce piano e la linea delle scadenze sale ----------
let ticking = false;
function onScroll() {

    const inner = $('#heroInner');

    inner.style.opacity = Math.max(0, 1 - p * 1.1).toFixed(3);

const isPdf = f => f && (f.type === 'application/pdf' || /\.pdf$/i.test(f.name || ''));
async function getPdf() {
  if (!window.pdfjsLib) await loadScript('https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js');
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  return window.pdfjsLib;
}
// testo delle prime pagine, riga per riga (le etichette tipo "Scadenza" restano vicine alle loro date)
async function pdfText(doc, pages) {
  const out = [];
  for (let n = 1; n <= Math.min(pages, doc.numPages); n++) {
    const tc = await (await doc.getPage(n)).getTextContent(), rows = [];
    for (const it of tc.items) { if (!it.str || !it.str.trim()) continue; const y = Math.round(it.transform[5] / 3), x = it.transform[4];
      let r = rows.find(r => Math.abs(r.y - y) <= 1); if (!r) rows.push(r = { y, parts: [] }); r.parts.push({ x, s: it.str }); }
    rows.sort((a, b) => b.y - a.y).forEach(r => out.push(r.parts.sort((a, b) => a.x - b.x).map(p => p.s).join('   ')));
  }
  return out.join('\n');
}
async function pdfPage(doc, scale) { const pg = await doc.getPage(1), vp = pg.getViewport({ scale }); const c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height); await pg.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise; return c; }
async function readPdf(file, onPreview) {
  const lib = await getPdf(), doc = await lib.getDocument({ data: await file.arrayBuffer() }).promise;
  const first = await pdfPage(doc, 1.6); onPreview(first);
  const text = await pdfText(doc, 3);
  if (text.replace(/\s/g, '').length > 40) return P.parseOcr(text); // PDF con testo vero: lettura precisa
  const w = await getOcr(); const { data } = await w.recognize(prepForOcr(await pdfPage(doc, 2.6))); // PDF scansionato: come una foto
  return P.parseOcr(data.text || '');
}

    else if (/load|initializ/.test(m.status)) { bar.style.width = '8%'; msg.textContent = 'Preparo la lettura. La prima volta ci vuole qualche secondo in più.'; } };
  try { const res = await readPhoto(img); if (cancelled) return; onSheetClose = null; go(res); }

function leadLabel(min, timed) {
  if (timed && min === 0) return 'puntuale';

  if (timed && min < 1440) return min === 60 ? "un'ora prima" : `${Math.round(min / 60)} ore prima`;
  const d = Math.round(min / 1440);
  if (d === 0) return 'la mattina stessa';
  if (d === 1) return 'il giorno prima';

}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
// Un solo "orecchio", riusato ogni volta. Su iPhone, aprirne uno nuovo mentre il vecchio non ha ancora chiuso,
// o chiuderlo di colpo, può lasciare il microfono muto: qui si aspetta sempre che abbia chiuso davvero.
const Ear = (() => {
  let r = null, busy = false, h = null, queued = null;
  const make = () => {
    const x = new SR(); x.lang = 'it-IT'; x.interimResults = true; x.continuous = true; x.maxAlternatives = 1;
    x.onstart = () => { if (h && h.start) h.start(); };
    x.onresult = e => { if (h && h.result) h.result(joinResults(e.results)); };
    x.onerror = e => { if (h && h.error) h.error((e && e.error) || 'error'); };
    x.onend = () => { busy = false; const cb = h && h.end; if (queued) { const q = queued; queued = null; q(); } else if (cb) cb(); };
    return x;
  };
  function start(handlers) {
    if (!SR) return false;
    h = handlers;
    if (busy) { queued = () => start(handlers); try { r.stop(); } catch (e) {} return true; }
    if (!r) r = make();
    try { r.start(); busy = true; return true; }
    catch (e) { try { reset(); r = make(); h = handlers; r.start(); busy = true; return true; } catch (e2) { return false; } }
  }
  function stop() { h = null; queued = null; if (r && busy) { try { r.stop(); } catch (e) {} } }
  // se qualcosa si è inceppato, la prossima volta si riparte con un orecchio nuovo
  function reset() { const old = r; r = null; busy = false; h = null; queued = null;
    if (old) { old.onresult = old.onend = old.onerror = old.onstart = null; try { old.abort(); } catch (e) {} } }
  return { start, stop, reset };
})();
// iPhone a volte ripete nei risultati tutto quello che hai già detto: qui si tiene una copia sola
function joinResults(results) {
  let out = '';
  for (let i = 0; i < results.length; i++) {
    const t = String(results[i][0].transcript || '').trim(); if (!t) continue;
    const a = out.toLowerCase(), b = t.toLowerCase();
    if (!out || b.startsWith(a)) out = t;
    else if (a.endsWith(b) || (b.length > 12 && a.includes(b))) continue;
    else out += ' ' + t;
  }
  return out;
}
const joinText = (a, b) => [a, b].filter(Boolean).join(' ').replace(/\s+/g, ' ').trim();

(() => {
  const el = $('#swimmer'); let tm = null, anim = null;
  if (!el || !el.animate || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const later = ms => { clearTimeout(tm); tm = setTimeout(swim, ms); };
  const free = () => document.visibilityState === 'visible' && page === 'home' && $('#sheetWrap').hidden && !document.querySelector('.intro')
    && window.scrollY < innerHeight * 0.4 && $('#heroKnot').hasAttribute('hidden');
  function swim(force) {
    if (!force && !free()) { later(20000); return; }
    if (anim) anim.cancel();
    const W = innerWidth, H = innerHeight, r = Math.random;
    const size = 36 + r() * 14, x0 = -size, x1 = W + size;
    const y0 = H * (0.42 + r() * 0.3), rise = H * (0.14 + r() * 0.2);           // sale verso destra
    const A = H * (0.025 + r() * 0.035), k = 0.8 + r() * 1.1, ph = r() * 6.28;      // ondeggia
    const dart = 0.05 + r() * 0.05, dk = 1.5 + r() * 1.5;                           // scatti di velocità
    const X = f => x0 + (x1 - x0) * (f + dart * Math.sin(6.283 * dk * f) / (6.283 * dk) * 2.5);
    const Y = f => y0 - rise * (f * f * 0.4 + f * 0.6) + A * Math.sin(6.283 * k * f + ph) - A * Math.sin(ph);
    const N = 48, frames = [];
    for (let i = 0; i <= N; i++) {
      const f = i / N, e = 0.002, ang = Math.atan2(Y(f + e) - Y(f - e), X(f + e) - X(f - e)) * 57.3;
      frames.push({ transform: `translate(${X(f).toFixed(1)}px,${Y(f).toFixed(1)}px) rotate(${ang.toFixed(1)}deg) scale(${(size / 40).toFixed(3)})`, opacity: i === 0 || i === N ? 0 : 0.85 });
    }
    anim = el.animate(frames, { duration: 3200 + r() * 1800, easing: 'linear' });
    anim.onfinish = () => { anim = null; };
    if (!force) later((55 + r() * 75) * 1000);
  }
  later((12 + r0() * 18) * 1000);
  function r0() { return Math.random(); }
  window.memoSwim = () => swim(true);
})();

function icsText(list) {
  const e = s => String(s).replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;');
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//MeMo//IT', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH'];
  for (const it of list) {
    const ty = T(it.type), d = it.due.replace(/-/g, '');
    L.push('BEGIN:VEVENT', `UID:${it.id}@memo`, `DTSTAMP:${stamp}`);
    if (it.time) L.push(`DTSTART:${d}T${it.time.replace(':', '')}00`, 'DURATION:PT30M');
    else L.push(`DTSTART;VALUE=DATE:${d}`, `DTEND;VALUE=DATE:${P.addDays(it.due, 1).replace(/-/g, '')}`);
    L.push(`SUMMARY:${e(it.title)}`, `DESCRIPTION:${e(ty.todo || 'Un MeMo per te')}`);
    const start = it.time ? P.dueAt(it) : P.parseISO(it.due);
    for (const r of P.remindersOf(it)) {
      const m = Math.round((r - start) / 60000);
      L.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${e(it.title)}`, `TRIGGER:${m < 0 ? '-' : ''}PT${Math.abs(m)}M`, 'END:VALARM');
    }
    L.push('END:VEVENT');
  }
  L.push('END:VCALENDAR'); return L.join('\r\n');
}
function addToCalendar(list) {

  const url = URL.createObjectURL(new Blob([icsText(list)], { type: 'text/calendar' }));
  const a = document.createElement('a'); a.href = url; a.rel = 'noopener'; if (!isIOS) a.download = 'memo.ics';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 60000);
}

function followText(it) {
  const all = P.remindersOf(it), first = P.remindAt(it), due = P.dueAt(it);
  const rest = all.filter(r => r > first);
  if (!rest.length) return '';
  const parts = rest.map(r => {
    if (it.time) return P.toISO(r) === it.due ? 'la mattina stessa' : 'la sera prima';
    const d = P.diffDays(P.toISO(r), it.due);
    return d === 0 ? 'il giorno stesso' : d === 1 ? 'il giorno prima' : d === 7 ? 'una settimana prima' : d === 30 ? 'un mese prima' : `${d} giorni prima`;
  });
  const list = parts.length === 1 ? parts[0] : parts.slice(0, -1).join(', ') + ' e ' + parts[parts.length - 1];
  return `Poi te lo ricordo ancora ${list}, finché non lo segni come fatto.`;
}
function allRemindText(it) {
  const now = new Date(), next = P.remindersOf(it).filter(r => r > now);
  return next.map(r => remindText(r, !!it.time).replace(/^il /, '').replace(/^alle /, 'oggi alle ')).join(' · ');
}

    if (perm !== 'granted') return state();
    const reg = await navigator.serviceWorker.ready;
    const { key } = await (await fetch(MEMO_SERVER + '/vapid')).json();
    let sub = await reg.pushManager.getSubscription();
    try { if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyBytes(key) }); }
    catch (e) { if (sub) await sub.unsubscribe(); sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyBytes(key) }); }
    await post('/subscribe', { sub: sub.toJSON(), subject: location.origin + location.pathname });
    store.set('push', '1'); await sync();
    return state();
  }
  // tutti gli avvisi futuri di tutti i MeMo, con i testi già pronti: il server li manda all'ora giusta
  function plan() {
    const now = Date.now(), max = now + 400 * 86400000, out = [];
    for (const it of items) for (const r of P.remindersOf(it)) {
      const t = r.getTime(); if (t <= now || t > max) continue;
      const n = N.make(it, { name: userName(), emoji: emojiOf(it), at: r });
      out.push({ k: `${it.id}@${t}`, at: t, title: n.title, body: n.body, url: n.url, tag: it.id });
    }
    return out;
  }
  let timer = null, last = '';
  async function sync() {
    if (state() !== 'on') return;
    const reminders = plan(), sig = JSON.stringify(reminders.map(r => r.k));
    try { await post('/sync', { reminders }); last = sig; } catch (e) { last = ''; }
  }
  const later = () => { if (state() !== 'on') return; clearTimeout(timer); timer = setTimeout(sync, 1500); };
  // ogni volta che apri MeMo: il server riceve l'iscrizione attuale del telefono (l'iPhone a volte la rinnova da solo)
  async function subscription(fresh) {
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (fresh && sub) { try { await sub.unsubscribe(); } catch (e) {} sub = null; }
    if (!sub) { const { key } = await (await fetch(MEMO_SERVER + '/vapid')).json(); sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyBytes(key) }); }
    await post('/subscribe', { sub: sub.toJSON(), subject: location.origin + location.pathname });
  }
  async function refresh() { if (state() !== 'on') return; try { await subscription(false); } catch (e) {} }
  // la prova: se Apple dice che l'iscrizione non vale più, se ne crea una nuova e si riprova una volta
  async function test(n) {
    let r;
    try { r = await post('/test', { message: n }); } catch (e) { r = { ok: false, status: /no subscription/.test(e.message) ? 410 : 0, reason: e.message }; }
    if (!r.ok && (r.status === 404 || r.status === 410 || r.status === 403)) {
      try { await subscription(true); r = await post('/test', { message: n }); } catch (e) { r = { ok: false, status: r.status, reason: e.message }; }
    }
    return r;
  }
  // l'AI del server capisce la frase; se non risponde in pochi secondi, si va avanti senza
  async function understand(text, ctl) {
    const now = new Date().toLocaleString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    ctl = ctl || new AbortController(); const t = setTimeout(() => ctl.abort(), 6000);
    try {
      const r = await fetch(MEMO_SERVER + '/understand', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...me(), text, now }), signal: ctl.signal });
      if (r.status === 501) throw new Error('no ai');
      const j = await r.json(); return j && j.ok ? j.result : null;
    } finally { clearTimeout(t); }
  }
  // Siri: il telefono si presenta al server una volta, poi il Comando Rapido usa il suo indirizzo personale
  async function register() { if (!MEMO_SERVER) return; try { await post('/register', { tz: Intl.DateTimeFormat().resolvedOptions().timeZone || 'Europe/Rome' }); store.set('reg', '1'); } catch (e) {} }
  const siriUrl = () => { const m = me(); return `${MEMO_SERVER}/in/${m.device}.${m.token}`; };
  async function take() { if (!MEMO_SERVER || store.get('reg') !== '1') return []; try { const j = await post('/inbox/take', {}); return j.items || []; } catch (e) { return []; } }
  return { state, enable, sync, later, test, understand, register, siriUrl, take, refresh };
})();
function autoListen() {
  if (store.get('autoListen') === '0' || navigator.webdriver) return;
  if (document.querySelector('.intro') || !$('#sheetWrap').hidden || page !== 'home' || document.hidden) return;
  openVoice({ auto: true });
}
// i MeMo detti a Siri arrivano dal server: si aggiungono alla lista
let importing = false;
async function importInbox() {
  if (importing) return; importing = true;
  try {
    const got = await Push.take(), fresh = got.filter(it => it && it.id && !items.some(x => x.id === it.id));
    for (const it of fresh) { await DB.put(it); items.push(it); }
    if (fresh.length) { render(); toast(fresh.length === 1 ? `Da Siri: ${fresh[0].title}` : `Da Siri: ${fresh.length} MeMo nuovi`, fresh.length === 1 ? `${cap(whenText(fresh[0]))}. Ce l'ho io.` : fresh.map(x => x.title).slice(0, 3).join(', ') + '.'); }
  } finally { importing = false; }
}
// aprendo una notifica si apre il MeMo giusto
function openFromUrl(u) { try { const id = new URL(u, location.href).searchParams.get('memo'); if (id && items.some(i => i.id === id)) { goPage('home', 0, true); openDetail(id); } } catch (e) {} }
if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.type === 'open') openFromUrl(e.data.url); });

// ================= Avvisi mentre l'app è aperta =================
const alerted = new Set();
function tick() {
  const nowD = new Date();
  for (const it of items) {
    for (const r of P.remindersOf(it)) {
      const key = it.id + '@' + r.getTime();
      if (r <= nowD && nowD - r < 3 * 60000 && !alerted.has(key)) { alerted.add(key); if (Push.state() !== 'on') showBanner(N.make(it, { name: userName(), emoji: emojiOf(it), at: r }), it); }
    }
  }
  render();
}

// ================= Tastiera chiusa: lo schermo torna intero =================
// Sull'iPhone, nelle app sulla Home, quando la tastiera si chiude a volte la pagina resta "corta"
// e i tasti in basso restano sollevati. Qui si costringe il telefono a ricalcolare tutto.
(() => {
  const vv = window.visualViewport;
  const fixFixed = () => {
    const y = window.scrollY;
    window.scrollTo(0, y + 1); window.scrollTo(0, y);
    for (const el of document.querySelectorAll('.dock, .peek, .bar')) { el.style.display = 'none'; void el.offsetHeight; el.style.display = ''; }
    gapFix();
  };
  // rete di sicurezza: se lo schermo visibile è più alto della pagina, i tasti scendono della differenza
  const gapFix = () => {
    if (!vv) return;
    const gap = Math.max(0, Math.round(vv.height + vv.offsetTop - window.innerHeight));
    document.documentElement.style.setProperty('--kbfix', (gap > 2 ? gap : 0) + 'px');
  };
  let typing = false;
  document.addEventListener('focusin', e => { if (e.target.matches('input, textarea')) typing = true; });
  document.addEventListener('focusout', e => { if (!e.target.matches('input, textarea')) return; typing = false;
    setTimeout(() => { if (!typing) fixFixed(); }, 80); setTimeout(() => { if (!typing) fixFixed(); }, 450); });
  if (vv) { let h = vv.height; vv.addEventListener('resize', () => { if (vv.height - h > 120 && !typing) setTimeout(fixFixed, 60); h = vv.height; gapFix(); }); }
  window.addEventListener('pageshow', fixFixed);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) setTimeout(fixFixed, 60); });
})();

// ================= Avvio =================
(async function init() {
  try { items = await DB.all(); } catch (e) { items = []; }
  render();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  if (isIOS && !isStandalone() && store.get('installHint') !== '1') $('#installHint').hidden = false;
  $('#installClose').onclick = () => { $('#installHint').hidden = true; store.set('installHint', '1'); };
  if (store.get('intro') !== '1' && !new URLSearchParams(location.search).has('nointro')) showIntro();
  openFromUrl(location.href);
  if (MEMO_SERVER && store.get('reg') !== '1') Push.register();
  Push.refresh().finally(() => importInbox().finally(() => Push.sync()));
  window.addEventListener('online', () => Push.sync()); // tornata la connessione: aggiorno gli avvisi rimasti indietro

  document.addEventListener('visibilitychange', () => { if (!document.hidden) Push.refresh().finally(() => importInbox().finally(() => Push.sync())); });
  setInterval(tick, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
